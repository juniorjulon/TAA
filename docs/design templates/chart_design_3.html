<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ISM Manufacturing PMI</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root[data-theme="dark"] {
    --bg: #131313;
    --surface: #1a1a1a;
    --border: #2a2a2a;
    --text-primary: #ffffff;
    --text-secondary: #a0a0a0;
    --text-accent: #d0d0d0;
    --line-color: #f59e0b;
    --fill-start: rgba(245, 158, 11, 0.15);
    --fill-end: rgba(245, 158, 11, 0.0);
    --hover-line: rgba(245, 158, 11, 0.3);
    --dot-color: #f59e0b;
    --dot-ring: rgba(245, 158, 11, 0.2);
    --tag-bg: rgba(245, 158, 11, 0.08);
    --tag-border: rgba(245, 158, 11, 0.22);
    --grid: rgba(255,255,255,0.04);
    --label: #606060;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    font-family: 'IBM Plex Sans', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    width: 100%;
    max-width: 680px;
    padding: 24px 24px 20px;
  }

  .header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 4px;
  }

  .country-tag {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    font-weight: 500;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 4px;
  }

  .chart-title {
    font-size: 14px;
    font-weight: 600;
    color: var(--text-primary);
    letter-spacing: -0.01em;
  }

  .price-row {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin: 10px 0 18px;
    min-height: 22px;
  }

  .price-separator {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 14px;
    color: var(--border);
    margin: 0 2px;
    align-self: center;
  }

  .price-z-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    font-weight: 500;
    color: #94a3b8;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    align-self: center;
  }

  .price-z {
    color: #94a3b8 !important;
    font-size: 20px;
  }

  .price-main {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 20px;
    font-weight: 500;
    color: var(--text-primary);
    letter-spacing: -0.02em;
    transition: color 0.15s;
  }

  .chart-wrap {
    position: relative;
    width: 100%;
    height: 180px;
    cursor: crosshair;
  }

  svg.chart {
    width: 100%;
    height: 100%;
    overflow: visible;
  }

  .grid-line {
    stroke: var(--grid);
    stroke-width: 1;
  }

  .axis-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9px;
    fill: var(--label);
    letter-spacing: 0.04em;
  }

  .area-fill { transition: opacity 0.3s; }

  .line-path {
    fill: none;
    stroke: var(--line-color);
    stroke-width: 1.8;
    stroke-linejoin: round;
    stroke-linecap: round;
  }

  .hover-line {
    stroke: var(--hover-line);
    stroke-width: 1;
    stroke-dasharray: 4 3;
    opacity: 0;
    pointer-events: none;
  }

  .hover-dot {
    fill: var(--dot-color);
    r: 4;
    opacity: 0;
    pointer-events: none;
    filter: drop-shadow(0 0 4px var(--dot-color));
  }

  .hover-dot-ring {
    fill: none;
    stroke: var(--dot-color);
    stroke-width: 1;
    r: 8;
    opacity: 0;
    pointer-events: none;
  }

  .hover-overlay {
    fill: transparent;
    cursor: crosshair;
  }

  .date-row {
    display: flex;
    justify-content: space-between;
    margin-top: 6px;
    padding: 0 2px;
  }

  .date-lbl {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    color: var(--label);
    letter-spacing: 0.04em;
  }

  .timeframes {
    display: flex;
    gap: 2px;
    margin-top: 16px;
    border-top: 1px solid var(--border);
    padding-top: 14px;
  }

  .tf {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    font-weight: 400;
    color: var(--text-secondary);
    padding: 4px 9px;
    border-radius: 5px;
    cursor: pointer;
    letter-spacing: 0.04em;
    transition: all 0.15s;
  }

  .tf:hover { color: var(--text-primary); background: var(--border); }
  .tf.active {
    color: var(--line-color);
    background: var(--tag-bg);
    border: 1px solid var(--tag-border);
    font-weight: 500;
  }

  .footer {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-top: 14px;
  }

  .stat { display: flex; align-items: center; gap: 6px; }

  .stat-key {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    color: var(--text-secondary);
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  .stat-val {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    font-weight: 500;
    color: var(--text-primary);
  }

  .divider { width: 1px; height: 14px; background: var(--border); }

  /* ── Z-score toggle switch ─────────────────────────────── */
  .z-score-toggle {
    position: relative;
    width: 28px;
    height: 14px;
    background: var(--border);
    border-radius: 7px;
    cursor: pointer;
    border: none;
    transition: background 0.3s;
    padding: 0;
    display: flex;
    align-items: center;
  }

  .z-score-toggle::after {
    content: '';
    position: absolute;
    left: 1px;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--text-secondary);
    transition: left 0.3s, background 0.3s;
  }

  .z-score-toggle.active { background: #94a3b8; }
  .z-score-toggle.active::after { left: 15px; background: var(--text-primary); }

  /* ── Z-score series ────────────────────────────────────── */
  .line-path-z {
    fill: none;
    stroke: #94a3b8;
    stroke-width: 1.8;
    stroke-linejoin: round;
    stroke-linecap: round;
    opacity: 0;
    transition: opacity 0.3s;
  }
  .line-path-z.visible { opacity: 1; }

  .area-fill-z { opacity: 0; transition: opacity 0.3s; }
  .area-fill-z.visible { opacity: 1; }

  /* ── Z-score grid/axis (show with toggle) ──────────────── */
  .grid-line-z { display: none; }
  .grid-line-z.visible { display: inline; }
  .axis-label-z { display: none; }
  .axis-label-z.visible { display: inline; }

  /* ── Percentile band lines ─────────────────────────────── */
  .perc-band {
    display: none;
    fill: rgba(0, 217, 255, 0.04);
  }
  .perc-band.visible { display: inline; }

  .perc-line {
    stroke: rgba(0, 217, 255, 0.45);
    stroke-width: 1;
    stroke-dasharray: 5 3;
    display: none;
  }
  .perc-line.visible { display: inline; }

  .perc-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9px;
    fill: rgba(0, 217, 255, 0.7);
    letter-spacing: 0.04em;
    display: none;
  }
  .perc-label.visible { display: inline; }

  /* Tooltip date */
  .tooltip-date {
    position: absolute;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 3px 8px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    color: var(--text-secondary);
    pointer-events: none;
    opacity: 0;
    white-space: nowrap;
    transition: opacity 0.1s;
    top: -4px;
    transform: translateX(-50%);
    letter-spacing: 0.04em;
  }
</style>
</head>
<body>

<div class="card">
  <div class="header">
    <div>
      <div class="country-tag">US</div>
      <div class="chart-title">ISM Manufacturing PMI</div>
    </div>
  </div>

  <div class="price-row">
    <span class="price-main" id="price-display">154.94</span>
    <span class="price-separator" id="zScoreSeparator" style="display:none;">|</span>
    <span class="price-z-label" id="zScoreLabel" style="display:none;">Z</span>
    <span class="price-main price-z" id="z-display" style="display:none;">2.30</span>
  </div>

  <div class="chart-wrap" id="chartWrap">
    <svg class="chart" id="chartSvg" viewBox="0 0 640 180" preserveAspectRatio="none">
      <defs>
        <linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="var(--line-color)" stop-opacity="0.3"/>
          <stop offset="100%" stop-color="var(--line-color)" stop-opacity="0"/>
        </linearGradient>
        <linearGradient id="areaGradZ" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#94a3b8" stop-opacity="0.2"/>
          <stop offset="100%" stop-color="#94a3b8" stop-opacity="0"/>
        </linearGradient>
        <clipPath id="chartClip">
          <rect x="0" y="0" width="640" height="170"/>
        </clipPath>
      </defs>

      <!-- Price grid lines -->
      <line class="grid-line" x1="0" y1="42" x2="640" y2="42"/>
      <line class="grid-line" x1="0" y1="84" x2="640" y2="84"/>
      <line class="grid-line" x1="0" y1="126" x2="640" y2="126"/>
      <line class="grid-line" x1="0" y1="168" x2="640" y2="168"/>

      <!-- Price Y axis labels -->
      <text class="axis-label" x="2" y="39"  text-anchor="start">156</text>
      <text class="axis-label" x="2" y="81"  text-anchor="start">154</text>
      <text class="axis-label" x="2" y="123" text-anchor="start">152</text>
      <text class="axis-label" x="2" y="165" text-anchor="start">150</text>

      <!-- Z-Score grid lines (toggle) -->
      <line class="grid-line grid-line-z" x1="0" y1="13"  x2="640" y2="13"/>
      <line class="grid-line grid-line-z" x1="0" y1="42"  x2="640" y2="42"/>
      <line class="grid-line grid-line-z" x1="0" y1="71"  x2="640" y2="71"/>
      <line class="grid-line grid-line-z" x1="0" y1="100" x2="640" y2="100"/>
      <line class="grid-line grid-line-z" x1="0" y1="129" x2="640" y2="129"/>
      <line class="grid-line grid-line-z" x1="0" y1="158" x2="640" y2="158"/>

      <!-- Z-Score Y axis labels (right, toggle) -->
      <text class="axis-label axis-label-z" x="638" y="17"  text-anchor="end"> 2.5</text>
      <text class="axis-label axis-label-z" x="638" y="46"  text-anchor="end"> 1.5</text>
      <text class="axis-label axis-label-z" x="638" y="75"  text-anchor="end"> 0.5</text>
      <text class="axis-label axis-label-z" x="638" y="104" text-anchor="end">-0.5</text>
      <text class="axis-label axis-label-z" x="638" y="133" text-anchor="end">-1.5</text>
      <text class="axis-label axis-label-z" x="638" y="162" text-anchor="end">-2.5</text>

      <!-- Percentile P25–P75 band fill -->
      <rect class="perc-band" id="percBand" x="0" y="0" width="640" height="0"/>

      <!-- Percentile lines (positioned by JS) -->
      <line class="perc-line" id="percP75Line" x1="0" y1="0" x2="640" y2="0"/>
      <line class="perc-line" id="percP25Line" x1="0" y1="0" x2="640" y2="0"/>

      <!-- Percentile labels (right side) -->
      <text class="perc-label" id="percP75Label" x="636" y="0" text-anchor="end">P75</text>
      <text class="perc-label" id="percP25Label" x="636" y="0" text-anchor="end">P25</text>

      <!-- Area and lines -->
      <g clip-path="url(#chartClip)">
        <path id="areaPath"  class="area-fill"   fill="url(#areaGrad)"/>
        <path id="linePath"  class="line-path"/>
        <path id="areaPathZ" class="area-fill-z"  fill="url(#areaGradZ)"/>
        <path id="linePathZ" class="line-path-z"/>
      </g>

      <!-- Hover elements -->
      <line class="hover-line" id="hoverLine" x1="0" y1="0" x2="0" y2="170"/>
      <circle class="hover-dot-ring" id="hoverRing" cx="0" cy="0"/>
      <circle class="hover-dot"      id="hoverDot"  cx="0" cy="0"/>

      <!-- Overlay -->
      <rect class="hover-overlay" id="hoverOverlay" x="0" y="0" width="640" height="170"/>
    </svg>
    <div class="tooltip-date" id="tooltipDate"></div>
  </div>

  <div class="date-row">
    <span class="date-lbl">May 4</span>
    <span class="date-lbl">May 5</span>
    <span class="date-lbl">May 6</span>
  </div>

  <div class="timeframes">
    <div class="tf">1D</div>
    <div class="tf active">5D</div>
    <div class="tf">1M</div>
    <div class="tf">6M</div>
    <div class="tf">YTD</div>
    <div class="tf">1Y</div>
    <div class="tf">5Y</div>
    <div class="tf">MAX</div>
  </div>

  <div class="footer">
    <div class="stat">
      <span class="stat-key">Latest</span>
      <span class="stat-val">52.7</span>
    </div>
    <div class="divider"></div>
    <div class="stat">
      <span class="stat-key">Z</span>
      <span class="stat-val" style="color: #94a3b8" id="zScoreVal">—</span>
    </div>
    <div class="divider"></div>
    <div style="display:flex; align-items:center; gap:6px;">
      <span style="font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--text-secondary); text-transform:uppercase; letter-spacing:0.06em;">Z-Score</span>
      <button class="z-score-toggle" id="zScoreToggle"></button>
    </div>
  </div>
</div>

<script>
// ── Data ──────────────────────────────────────────────────────────────────
const rawData = [
  152.3, 152.1, 151.8, 151.5, 151.9, 152.4, 152.0, 151.7, 151.4, 151.2,
  151.0, 150.8, 150.5, 150.3, 150.1, 150.4, 150.7, 151.0, 151.3, 151.1,
  150.9, 150.7, 150.6, 150.8, 151.1, 151.4, 151.2, 151.0, 150.8, 150.6,
  150.4, 150.2, 150.0, 150.3, 150.6, 150.8, 151.0, 151.3, 151.5, 151.8,
  152.0, 152.2, 152.1, 151.9, 151.7, 151.5, 151.8, 152.1, 152.3, 152.5,
  152.4, 152.2, 152.0, 151.9, 152.1, 152.4, 152.7, 152.5, 152.3, 152.1,
  152.4, 152.7, 153.0, 152.8, 152.6, 152.4, 152.2, 152.5, 152.8, 153.0,
  153.3, 153.5, 153.3, 153.1, 152.9, 152.7, 152.5, 152.8, 153.1, 153.4,
  153.6, 153.5, 153.3, 153.2, 153.0, 153.3, 153.6, 153.9, 154.2, 154.5,
  154.3, 154.1, 153.9, 153.7, 154.0, 154.3, 154.6, 154.8, 154.94
];

const zScoreData = [
  -1.2, -1.15, -1.3, -1.35, -1.0, -0.8, -1.1, -1.25, -1.4, -1.5,
  -1.6, -1.7, -1.75, -1.8, -1.85, -1.65, -1.45, -1.25, -1.05, -1.15,
  -1.35, -1.45, -1.55, -1.35, -1.15, -0.95, -1.1, -1.3, -1.4, -1.5,
  -1.6, -1.75, -1.9, -1.7, -1.5, -1.3, -1.1, -0.9, -0.7, -0.5,
  -0.3, -0.1,  0.1,  0.3,  0.5,  0.7,  0.5,  0.3,  0.1, -0.2,
  -0.4, -0.6, -0.8, -0.9, -0.7, -0.5, -0.2,  0.0,  0.2,  0.4,
   0.5,  0.7,  0.9,  1.1,  1.3,  1.5,  1.7,  1.5,  1.3,  1.1,
   0.9,  0.7,  0.8,  1.0,  1.2,  1.4,  1.6,  1.4,  1.2,  1.0,
   0.8,  0.9,  1.1,  1.3,  1.5,  1.7,  1.8,  1.9,  2.0,  2.1,
   2.0,  1.9,  1.7,  1.5,  1.8,  1.9,  2.0,  2.2,  2.3
];

// ── Scales ────────────────────────────────────────────────────────────────
const SVG_W = 640, SVG_H = 170;
const PAD_L = 28, PAD_R = 8, PAD_T = 6, PAD_B = 8;

const minVal = 149.5, maxVal = 156;
const minZScore = -2.5, maxZScore = 2.5;

function scaleX(i) {
  return PAD_L + (i / (rawData.length - 1)) * (SVG_W - PAD_L - PAD_R);
}
function scaleY(v) {
  return PAD_T + (1 - (v - minVal) / (maxVal - minVal)) * (SVG_H - PAD_T - PAD_B);
}
function scaleYZ(v) {
  return PAD_T + (1 - (v - minZScore) / (maxZScore - minZScore)) * (SVG_H - PAD_T - PAD_B);
}

// ── Percentile calculation ────────────────────────────────────────────────
function percentile(arr, p) {
  const sorted = [...arr].sort((a, b) => a - b);
  const idx = (p / 100) * (sorted.length - 1);
  const lo = Math.floor(idx);
  const hi = Math.ceil(idx);
  return sorted[lo] + (sorted[hi] - sorted[lo]) * (idx - lo);
}

const p25Val = percentile(zScoreData, 25);
const p75Val = percentile(zScoreData, 75);
const p25Y   = scaleYZ(p25Val);
const p75Y   = scaleYZ(p75Val);

// Position percentile lines
document.getElementById('percP75Line').setAttribute('y1', p75Y);
document.getElementById('percP75Line').setAttribute('y2', p75Y);
document.getElementById('percP25Line').setAttribute('y1', p25Y);
document.getElementById('percP25Line').setAttribute('y2', p25Y);

// Position percentile labels (offset a few px above the line)
document.getElementById('percP75Label').setAttribute('y', p75Y - 3);
document.getElementById('percP25Label').setAttribute('y', p25Y - 3);

// Position and size the band rect (P75 is higher on screen = smaller Y)
document.getElementById('percBand').setAttribute('y', p75Y);
document.getElementById('percBand').setAttribute('height', p25Y - p75Y);

// ── Path builders ─────────────────────────────────────────────────────────
function buildPath() {
  return rawData.map((v, i) =>
    `${i === 0 ? 'M' : 'L'}${scaleX(i).toFixed(2)},${scaleY(v).toFixed(2)}`
  ).join(' ');
}

function buildArea() {
  const line   = buildPath();
  const lastX  = scaleX(rawData.length - 1).toFixed(2);
  const firstX = scaleX(0).toFixed(2);
  const bottom = (SVG_H - PAD_B).toFixed(2);
  return `${line} L${lastX},${bottom} L${firstX},${bottom} Z`;
}

function buildZScorePath() {
  return zScoreData.map((v, i) =>
    `${i === 0 ? 'M' : 'L'}${scaleX(i).toFixed(2)},${scaleYZ(v).toFixed(2)}`
  ).join(' ');
}

function buildZScoreArea() {
  const line   = buildZScorePath();
  const lastX  = scaleX(zScoreData.length - 1).toFixed(2);
  const firstX = scaleX(0).toFixed(2);
  const bottom = (SVG_H - PAD_B).toFixed(2);
  return `${line} L${lastX},${bottom} L${firstX},${bottom} Z`;
}

document.getElementById('linePath').setAttribute('d', buildPath());
document.getElementById('areaPath').setAttribute('d', buildArea());
document.getElementById('linePathZ').setAttribute('d', buildZScorePath());
document.getElementById('areaPathZ').setAttribute('d', buildZScoreArea());

// ── Hover interaction ─────────────────────────────────────────────────────
const overlay     = document.getElementById('hoverOverlay');
const hoverLine   = document.getElementById('hoverLine');
const hoverDot    = document.getElementById('hoverDot');
const hoverRing   = document.getElementById('hoverRing');
const priceDisp   = document.getElementById('price-display');
const zDisp       = document.getElementById('z-display');
const zSeparator  = document.getElementById('zScoreSeparator');
const zLabel      = document.getElementById('zScoreLabel');
const tooltipDate = document.getElementById('tooltipDate');
const chartWrap   = document.getElementById('chartWrap');

let showZScore = false;

const dates = [];
const startMs = new Date('2026-05-04T09:30:00').getTime();
const endMs   = new Date('2026-05-06T11:35:00').getTime();
for (let i = 0; i < rawData.length; i++) {
  dates.push(new Date(startMs + (endMs - startMs) * (i / (rawData.length - 1))));
}

function formatDate(d) {
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const h = d.getHours(), m = d.getMinutes();
  const ampm = h >= 12 ? 'PM' : 'AM';
  const hh = h % 12 || 12;
  const mm = m.toString().padStart(2, '0');
  return `${months[d.getMonth()]} ${d.getDate()}, ${hh}:${mm} ${ampm} UTC-4`;
}

overlay.addEventListener('mousemove', (e) => {
  const rect = document.getElementById('chartSvg').getBoundingClientRect();
  const svgX = ((e.clientX - rect.left) / rect.width) * SVG_W;
  const idx  = Math.max(0, Math.min(rawData.length - 1,
    Math.round((svgX - PAD_L) / (SVG_W - PAD_L - PAD_R) * (rawData.length - 1))
  ));

  const cx   = scaleX(idx);
  const val  = rawData[idx];
  const zVal = zScoreData[idx];
  const cy   = scaleY(val);

  hoverLine.setAttribute('x1', cx); hoverLine.setAttribute('x2', cx);
  hoverDot.setAttribute('cx', cx);  hoverDot.setAttribute('cy', cy);
  hoverRing.setAttribute('cx', cx); hoverRing.setAttribute('cy', cy);

  hoverLine.style.opacity = '1';
  hoverDot.style.opacity  = '1';
  hoverRing.style.opacity = '0.5';

  priceDisp.textContent = val.toFixed(2);
  if (showZScore) zDisp.textContent = zVal.toFixed(2);

  const wrapRect = chartWrap.getBoundingClientRect();
  tooltipDate.style.left    = (e.clientX - wrapRect.left) + 'px';
  tooltipDate.style.top     = (SVG_H + 8) + 'px';
  tooltipDate.textContent   = formatDate(dates[idx]);
  tooltipDate.style.opacity = '1';
});

overlay.addEventListener('mouseleave', () => {
  hoverLine.style.opacity   = '0';
  hoverDot.style.opacity    = '0';
  hoverRing.style.opacity   = '0';
  tooltipDate.style.opacity = '0';
  priceDisp.textContent = '154.94';
  if (showZScore) zDisp.textContent = zScoreData[zScoreData.length - 1].toFixed(2);
});

// ── Z-Score toggle ────────────────────────────────────────────────────────
const zToggle   = document.getElementById('zScoreToggle');
const zScoreLine = document.getElementById('linePathZ');
const zScoreArea = document.getElementById('areaPathZ');
const zScoreVal  = document.getElementById('zScoreVal');

zToggle.addEventListener('click', () => {
  showZScore = !showZScore;
  zScoreLine.classList.toggle('visible');
  zScoreArea.classList.toggle('visible');
  zToggle.classList.toggle('active');

  document.querySelectorAll('.grid-line-z').forEach(el => el.classList.toggle('visible'));
  document.querySelectorAll('.axis-label-z').forEach(el => el.classList.toggle('visible'));

  // Toggle percentile lines, band and labels together with z-score
  document.querySelectorAll('.perc-line').forEach(el => el.classList.toggle('visible'));
  document.querySelectorAll('.perc-label').forEach(el => el.classList.toggle('visible'));
  document.getElementById('percBand').classList.toggle('visible');

  const d = showZScore ? '' : 'none';
  zDisp.style.display      = d;
  zSeparator.style.display = d;
  zLabel.style.display     = d;
  if (showZScore) zDisp.textContent = zScoreData[zScoreData.length - 1].toFixed(2);
});

// Set initial Z-score footer value
zScoreVal.textContent = zScoreData[zScoreData.length - 1].toFixed(2);

// ── Timeframe pills ───────────────────────────────────────────────────────
document.querySelectorAll('.tf').forEach(el => {
  el.addEventListener('click', () => {
    document.querySelectorAll('.tf').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
  });
});
</script>
</body>
</html>
